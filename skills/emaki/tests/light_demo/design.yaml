# Light-and-material demo: test fixture for KeyLight, Glass, SoftShadow, sheen, depth of field
# and on_twos. Not a style example.
meta:
  name: Light demo
  style_ref: custom
  concept: "A dark product stage lit by one moving key light; a glass panel and a lifted card."
format:
  aspect: "16:9"
  fps: 30
  duration: 6
  platform: web
palette:
  bg:       {value: "#0A0D14", why: "near-black blue: light needs dark to read as light"}
  surface:  {value: "#F4F6FA", why: "white card, the brightest object"}
  text:     {value: "#F5F7FB", why: "copy on dark"}
  ink:      {value: "#0F1724", why: "copy on the white card"}
  muted:    {value: "#8A94A6", why: "labels"}
  accent:   {value: "#3B82F6", why: "one saturated blue"}
  accent_2: {value: "#22D3EE", why: "cyan end of the light gradient"}
type:
  scale: {base: 0.03, ratio: 1.333, why: "test"}
  roles:
    display: {family: "Lato", weight: 900, step: 5, line_height: 0.95, tracking: -0.02, why: "test"}
    title:   {family: "Lato", weight: 700, step: 2, line_height: 1.05, why: "test"}
    body:    {family: "Lato", weight: 400, step: 0, line_height: 1.3, why: "test"}
grid: {columns: 12, margin: 0.08, gutter: 0.02, why: "test"}
shape: {radius: 0.02, stroke: 0.002, why: "test"}
light:
  key: {from: top-left, color: "#9DB8FF", intensity: 0.3}
  ground: near-black blue
  shadows: soft
  depth_of_field: {aperture: 16, focus: 0}
  accent_lives_in: the light blobs, the chip, the sheen on the hero word
  why: "test fixture for the light and material primitives"
motion:
  tempo: medium
  easing: {enter: out_expo, exit: in_cubic, move: in_out_cubic, emphasis: out_back, transition: in_out_cubic}
  durations: {micro: 0.18, short: 0.35, medium: 0.6, long: 1.1}
  stagger: 0.04
  transitions: [cut]
  why: "test"
fx:
  enabled:
    grain: {amount: 0.018, luma_weighted: true}
  forbidden: []
  why: "grain dithers the gradients (no banding) and adds tactile texture"
sound:
  genre: minimal
  bpm: 100
  key: "A minor"
  loudness: -14
  why: "test"
